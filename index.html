<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>板塊大冒險</title>
<style>
:root{--bg:#12263a;--panel:#1b3a57;--sand:#f2e6cf;--lava:#e8590c;--sea:#2a9d8f;--ink:#0d1b2a;--ok:#74c69d;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--sand);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 4px}
.sub{margin:0 0 12px;opacity:.8}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:2px solid var(--sand);background:transparent;color:var(--sand);border-radius:10px;font-size:1rem;cursor:pointer}
nav button.on{background:var(--sand);color:var(--ink);font-weight:700}
.card{background:var(--panel);border-radius:14px;padding:14px}
svg{width:100%;height:auto;display:block;background:#0e1f30;border-radius:10px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.btn{padding:12px 8px;border:0;border-radius:10px;background:var(--sea);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
.btn.lava{background:var(--lava)}
.btn.sand{background:var(--sand);color:var(--ink)}
.btn:focus-visible,nav button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.info{min-height:5.5em}
.info b{color:#ffd8a8}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;padding:12px;border-radius:10px;border:2px solid #3b5f82;background:transparent;color:var(--sand);font-size:1rem;cursor:pointer}
.opt.right{border-color:var(--ok);background:#1f4d3b}
.opt.wrong{border-color:var(--bad);background:#5a2a2a}
.bar{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:700}
.fb{margin-top:10px;padding:10px;border-radius:10px;background:#0e1f30}
.big{font-size:2.4rem;font-weight:800;text-align:center;margin:8px 0}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>板塊大冒險</h1>
<p class="sub">先動手做實驗，再挑戰闖關。</p>
<nav>
<button id="tLab" class="on">實驗室</button>
<button id="tMap">地震帶</button>
<button id="tQuiz">闖關</button>
</nav>

<section id="lab" class="card">
<svg id="lab-svg" viewBox="0 0 400 220" role="img" aria-label="板塊運動動畫"></svg>
<p class="sub" style="margin:10px 0 0">板塊邊界</p>
<div class="row" style="margin-top:4px">
<button class="btn lava" data-m="c">推擠</button>
<button class="btn" data-m="d">拉開</button>
<button class="btn sand" data-m="s">擦過</button>
</div>
<p class="sub" style="margin:0">斷層</p>
<div class="row" style="margin-top:4px">
<button class="btn" data-m="n">正斷層</button>
<button class="btn lava" data-m="r">逆斷層</button>
<button class="btn sand" data-m="p">平移斷層</button>
</div>
<div class="row" style="margin:4px 0 8px;grid-template-columns:1fr"><button class="btn sand" data-m="h">認識上盤和下盤</button></div>
<p class="sub" style="margin:0">火山</p>
<div class="row" style="margin-top:4px">
<button class="btn lava" data-m="v1">活火山</button>
<button class="btn" data-m="v2">休眠火山</button>
<button class="btn sand" data-m="v3">死火山</button>
</div>
<div class="info" id="info">按下按鈕，看看兩個板塊會發生什麼事。</div>
</section>

<section id="quiz" class="card hide">
<div id="qbox"></div>
</section>

<section id="map" class="card hide">
<div class="row" style="grid-template-columns:1fr 1fr;margin-top:0">
<button class="btn" id="mWorld">全球三大地震帶</button>
<button class="btn sand" id="mPac">環太平洋地震帶</button>
</div>

<div id="worldBox">
<svg id="world-svg" viewBox="0 0 400 220" role="img" aria-label="全球三大地震帶示意圖"></svg>
<p class="sub" style="margin:6px 0 0;font-size:.85rem">示意圖：陸地形狀已簡化。太平洋被切在左右兩邊，橘線其實是連成一圈。</p>
<div class="row" style="grid-template-columns:1fr 1fr">
<button class="btn lava" data-b="ring">環太平洋</button>
<button class="btn" style="background:#ffd43b;color:#0d1b2a" data-b="alp">地中海－喜馬拉雅</button>
<button class="btn" style="background:#5eead4;color:#0d1b2a" data-b="rid">大洋中脊</button>
<button class="btn sand" data-b="all">全部</button>
</div>
<div class="info" id="world-info"></div>
</div>

<div id="pacBox" class="hide">
<svg id="map-svg" viewBox="0 0 400 220" role="img" aria-label="環太平洋地震帶示意圖"></svg>
<p class="sub" style="margin:6px 0 0;font-size:.85rem">示意圖：陸地形狀與位置已簡化。點亮點看各地的板塊。</p>
<div class="info" id="map-info"><b>環太平洋地震帶</b>（橘色虛線）圍繞著太平洋，全世界大約九成的地震和大約七成五的活火山都集中在這裡，所以也叫「火環」。</div>
</div>
</section>
</main>

<script>
const NS="http://www.w3.org/2000/svg";
const INFO={
c:"<b>聚合邊界</b>：兩個板塊互相推擠。會形成<b>山脈、海溝、火山</b>，也容易發生強烈地震。台灣就是菲律賓海板塊推擠歐亞板塊而成。",
d:"<b>張裂邊界</b>：兩個板塊互相遠離。岩漿從裂縫冒出，形成新的地殼，例如<b>大西洋中洋脊</b>、東非大裂谷。",
n:"<b>正斷層</b>：地殼被<b>拉開</b>（張力），上盤相對下盤往下滑。上盤是斷層面上方的岩層，下盤是下方的岩層。",
r:"<b>逆斷層</b>：地殼被<b>擠壓</b>（壓力），上盤相對下盤往上推。921 地震的車籠埔斷層就是逆移斷層。",
p:"<b>平移斷層</b>：岩層<b>水平錯開</b>，幾乎沒有上下位移，所以公路、河流、圍籬會被橫向錯開。例如聖安地列斯斷層。",
v1:"<b>活火山</b>：岩漿庫還有岩漿，而且最近噴發過或隨時可能噴發。會噴出岩漿、火山灰和氣體。宜蘭外海的龜山島是台灣的活火山。",
v2:"<b>休眠火山</b>：歷史上噴發過，岩漿庫還有岩漿，目前暫時沒有噴發，可能只冒出水蒸氣或噴氣。它<b>有可能再醒來</b>，不能掉以輕心。",
v3:"<b>死火山</b>：岩漿庫已經冷卻凝固，不會再噴發，山體也被風雨慢慢侵蝕。<br><small>註：現在科學家更常說「活火山／非活火山」，因為很難確定一座火山會不會再噴發。</small>",
h:"<b>上盤</b>是斷層面上方的岩層，<b>下盤</b>是斷層面下方的岩層。口訣：想像你走在斷層面上，<b>頭上的是上盤，腳下的是下盤</b>。判斷正斷層或逆斷層，就看上盤相對下盤是往下還是往上。",
s:"<b>錯動邊界</b>：兩個板塊水平擦過。地殼累積能量後突然滑動，產生地震，例如美國<b>聖安地列斯斷層</b>。"
};

/* ---- 畫面：依模式與進度 t(0~1) 重畫 ---- */
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function drawFault(svg,m,t){
  svg.innerHTML="";
  const sh=t>0.85?(Math.random()*4-2):0;
  const d=(m==="n"?1:-1)*40*t,dx=0.49*d,dy=0.871*d;
  const defs=el("defs",{},svg);
  el("polygon",{points:"10,50 150,50 240,210 10,210"},el("clipPath",{id:"cf"},defs));
  el("polygon",{points:"150,50 390,50 390,210 240,210"},el("clipPath",{id:"ch"},defs));
  const bands=[[50,"#c9a66b"],[90,"#8e6e53"],[130,"#5a7fa8"],[170,"#2a9d8f"]];
  const root=el("g",{transform:`translate(${sh},0)`},svg);
  [["cf",0,0,60,"下盤"],["ch",dx,dy,320,"上盤"]].forEach(([id,x,y,lx,name])=>{
    const o=el("g",{transform:`translate(${x},${y})`},root);
    const i=el("g",{"clip-path":`url(#${id})`},o);
    bands.forEach(b=>el("rect",{x:0,y:b[0],width:400,height:40,fill:b[1]},i));
    const tx=el("text",{x:lx,y:130,fill:"#fff","font-size":16,"font-weight":700,"text-anchor":"middle"},o);tx.textContent=name;
  });
  el("line",{x1:150,y1:50,x2:240,y2:210,stroke:"#fff","stroke-width":2,"stroke-dasharray":"6 4"},root);
  const a=m==="n"?["M120 28 h-45 l10 -8 m-10 8 l10 8","M280 28 h45 l-10 -8 m10 8 l-10 8"]:["M75 28 h45 l-10 -8 m10 8 l-10 8","M325 28 h-45 l10 -8 m-10 8 l10 8"];
  a.forEach(p=>el("path",{d:p,stroke:"#f2e6cf","stroke-width":3,fill:"none"},root));
  const c=el("text",{x:200,y:16,fill:"#f2e6cf","font-size":13,"text-anchor":"middle"},root);c.textContent="剖面圖";
}
function drawRoad(svg,t){
  svg.innerHTML="";
  const sh=t>0.85?(Math.random()*4-2):0;
  const g=el("g",{transform:`translate(${sh},0)`},svg);
  const ly=40+25*t,ry=40-25*t;
  [[20,ly,"#6a994e"],[205,ry,"#8fb573"]].forEach(([x,y,c])=>{
    el("rect",{x:x,y:y,width:175,height:140,fill:c,rx:4},g);
    el("rect",{x:x,y:y+63,width:175,height:14,fill:"#4a4a4a"},g);
    el("line",{x1:x,x2:x+175,y1:y+70,y2:y+70,stroke:"#ffd43b","stroke-width":2,"stroke-dasharray":"8 6"},g);
  });
  el("line",{x1:200,x2:200,y1:10,y2:210,stroke:"#fff","stroke-width":2,"stroke-dasharray":"6 4"},g);
  const a=el("text",{x:110,y:20,fill:"#f2e6cf","font-size":14,"text-anchor":"middle"},g);a.textContent="↓ 往下";
  const b=el("text",{x:290,y:212,fill:"#f2e6cf","font-size":14,"text-anchor":"middle"},g);b.textContent="↑ 往上";
  const c=el("text",{x:200,y:216,fill:"#f2e6cf","font-size":12,"text-anchor":"middle"},g);c.textContent="俯視圖";
}
function drawVolcano(svg,m,t){
  svg.innerHTML="";
  const jit=m==="v1"&&t>0.2&&t<1?(Math.random()*3-1.5):0;
  const g=el("g",{transform:`translate(${jit},0)`},svg);
  const peak=m==="v3"?118:92;
  const mag=m==="v1"?"#e8590c":m==="v2"?"#b5541a":"#5c5c5c";
  el("rect",{x:0,y:170,width:400,height:50,fill:"#4a3a2e"},g);
  el("ellipse",{cx:200,cy:200,rx:70,ry:14,fill:mag},g);
  el("rect",{x:192,y:peak,width:16,height:90,fill:mag},g);
  el("polygon",{points:`70,170 178,${peak} 222,${peak} 330,170`,fill:m==="v3"?"#7d8f69":"#8a6a4f"},g);
  el("rect",{x:192,y:peak,width:16,height:8,fill:m==="v3"?"#5c5c5c":mag},g);
  const lab=el("text",{x:200,y:204,fill:"#fff","font-size":11,"text-anchor":"middle"},g);lab.textContent="岩漿庫";
  const name={v1:"活火山：正在噴發",v2:"休眠火山：有岩漿，暫時沒噴發",v3:"死火山：岩漿庫已冷卻"}[m];
  const nt=el("text",{x:10,y:20,fill:"#f2e6cf","font-size":14},g);nt.textContent=name;
  if(m==="v1"){
    [-1,1].forEach(d=>el("line",{x1:200+d*22,y1:peak,x2:200+d*(22+50*t),y2:peak+75*t,stroke:"#e8590c","stroke-width":5,"stroke-linecap":"round"},g));
    for(let j=0;j<5;j++)el("circle",{cx:184+j*8,cy:peak-20-35*t-j*3,r:8+16*t,fill:"#9aa0a6",opacity:0.7*t},g);
    for(let i=0;i<14;i++){
      const ti=Math.max(0,Math.min(1,t*1.3-i*0.03));if(ti<=0)continue;
      const x=200+((i*37)%61-30)*ti*1.6,y=peak-4-(120*ti-100*ti*ti)*(0.6+((i*13)%5)/10);
      el("circle",{cx:x,cy:y,r:3+(i%3),fill:i%2?"#ffa94d":"#e8590c"},g);
    }
  }else if(m==="v2"){
    for(let i=0;i<3;i++)el("circle",{cx:198+i*3,cy:peak-10-i*14-10*t,r:5+i*2,fill:"#e9ecef",opacity:0.6-0.15*i},g);
  }
}
function drawHW(svg,t){
  svg.innerHTML="";
  el("polygon",{points:"10,50 150,50 240,210 10,210",fill:"#2a9d8f"},svg);
  el("polygon",{points:"150,50 390,50 390,210 240,210",fill:"#d9733b"},svg);
  el("line",{x1:150,y1:50,x2:240,y2:210,stroke:"#fff","stroke-width":3,"stroke-dasharray":"8 5"},svg);
  const T=(x,y,sz,txt,w,o)=>{const e=el("text",{x:x,y:y,fill:"#fff","font-size":sz,"font-weight":w,"text-anchor":"middle",opacity:o},svg);e.textContent=txt};
  T(65,125,26,"下盤",800,1);T(320,125,26,"上盤",800,1);
  T(65,150,13,"斷層面下方（腳下）",400,t);T(320,150,13,"斷層面上方（頭上）",400,t);
  T(200,30,14,"斷層面",700,1);
  el("path",{d:"M200 36 L196 62",stroke:"#fff","stroke-width":2,fill:"none"},svg);
}
function draw(svg,m,t){
  if(m==="h"){drawHW(svg,t);return}
  if(m==="v1"||m==="v2"||m==="v3"){drawVolcano(svg,m,t);return}
  if(m==="n"||m==="r"){drawFault(svg,m,t);return}
  if(m==="p"){drawRoad(svg,t);return}
  svg.innerHTML="";
  const shake=t>0.85&&m!=="d"?(Math.random()*4-2):0;
  const g=el("g",{transform:`translate(${shake},0)`},svg);
  if(m==="c"){
    el("rect",{x:0,y:140,width:400,height:80,fill:"#7a2e0e"},g);
    el("rect",{x:10,y:100,width:180+30*t,height:40,fill:"#2a9d8f",rx:4},g);
    el("rect",{x:210-30*t,y:100,width:180+30*t,height:40,fill:"#5a7fa8",rx:4},g);
    el("polygon",{points:`${200-20-60*t},100 200,${100-75*t} ${200+20+60*t},100`,fill:"#b08968"},g);
    el("path",{d:"M5 70 h45 l-10 -8 m10 8 l-10 8",stroke:"#f2e6cf","stroke-width":3,fill:"none"},g);
    el("path",{d:"M395 70 h-45 l10 -8 m-10 8 l10 8",stroke:"#f2e6cf","stroke-width":3,fill:"none"},g);
  }else if(m==="d"){
    const lx=20-20*t,rx=210+20*t;
    el("rect",{x:0,y:140,width:400,height:80,fill:"#7a2e0e"},g);
    el("rect",{x:lx,y:100,width:170,height:40,fill:"#2a9d8f",rx:4},g);
    el("rect",{x:rx,y:100,width:170,height:40,fill:"#5a7fa8",rx:4},g);
    el("rect",{x:lx+170,y:92,width:rx-lx-170,height:60,fill:"#e8590c"},g);
    el("path",{d:"M150 60 h-45 l10 -8 m-10 8 l10 8",stroke:"#f2e6cf","stroke-width":3,fill:"none"},g);
    el("path",{d:"M250 60 h45 l-10 -8 m10 8 l-10 8",stroke:"#f2e6cf","stroke-width":3,fill:"none"},g);
  }else{
    const ly=40+25*t,ry=40-25*t;
    el("rect",{x:20,y:ly,width:175,height:140,fill:"#2a9d8f",rx:4},g);
    el("rect",{x:205,y:ry,width:175,height:140,fill:"#5a7fa8",rx:4},g);
    el("line",{x1:20,x2:195,y1:ly+70,y2:ly+70,stroke:"#fff","stroke-width":4,"stroke-dasharray":"10 6"},g);
    el("line",{x1:205,x2:380,y1:ry+70,y2:ry+70,stroke:"#fff","stroke-width":4,"stroke-dasharray":"10 6"},g);
    el("path",{d:"M30 24 v-0 M100 25 v0",stroke:"none"},g);
    const a=el("text",{x:110,y:20,fill:"#f2e6cf","font-size":14,"text-anchor":"middle"},g);a.textContent="↓ 往下";
    const b=el("text",{x:290,y:212,fill:"#f2e6cf","font-size":14,"text-anchor":"middle"},g);b.textContent="↑ 往上";
  }
}
function animate(svg,m,done){
  const start=performance.now(),dur=2200;
  (function f(now){
    const t=Math.min((now-start)/dur,1);
    draw(svg,m,t);
    if(t<1)requestAnimationFrame(f);else if(done)done();
  })(start);
}

/* ---- 實驗室 ---- */
const labSvg=document.getElementById("lab-svg");
draw(labSvg,"c",0);
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
  const m=b.dataset.m;
  document.getElementById("info").innerHTML="觀察中…";
  animate(labSvg,m,()=>document.getElementById("info").innerHTML=INFO[m]);
});

/* ---- 闖關 ---- */
const BANK=[
{m:"c",q:"動畫中兩個板塊正在互相推擠，這是哪一種邊界？",o:["聚合邊界","張裂邊界","錯動邊界"],a:0,e:"互相推擠就是聚合邊界。"},
{m:"d",q:"動畫中兩個板塊正在遠離，中間冒出岩漿。這是哪一種邊界？",o:["聚合邊界","張裂邊界","錯動邊界"],a:1,e:"遠離、岩漿冒出形成新地殼，是張裂邊界。"},
{m:"s",q:"動畫中兩個板塊水平擦過，這是哪一種邊界？",o:["聚合邊界","張裂邊界","錯動邊界"],a:2,e:"水平方向互相擦過，是錯動邊界。"},
{q:"台灣位在哪兩個板塊的交界附近？",o:["太平洋板塊與南極洲板塊","菲律賓海板塊與歐亞板塊","印度洋板塊與非洲板塊"],a:1,e:"菲律賓海板塊向西北推擠歐亞板塊，所以台灣有高山也常有地震。"},
{q:"大西洋中洋脊是哪一種板塊邊界？",o:["聚合邊界","張裂邊界","錯動邊界"],a:1,e:"大西洋兩側的板塊慢慢遠離，岩漿在中間生成新地殼。"},
{q:"下列哪一組地形最常出現在聚合邊界？",o:["高山、海溝、火山","平原、湖泊、沙丘","三角洲、河口、沙洲"],a:0,e:"板塊推擠、擠壓與隱沒，會形成山脈、海溝與火山。"},
{q:"美國加州的聖安地列斯斷層屬於哪一種邊界？",o:["聚合邊界","張裂邊界","錯動邊界"],a:2,e:"兩側板塊水平錯動，是錯動邊界的代表。"},
{m:"n",q:"動畫中，上盤相對下盤往下滑。這是哪一種斷層？",o:["正斷層","逆斷層","平移斷層"],a:0,e:"上盤往下滑、地殼被拉開，是正斷層。"},
{m:"r",q:"動畫中，上盤相對下盤往上推。這是哪一種斷層？",o:["正斷層","逆斷層","平移斷層"],a:1,e:"上盤往上推、地殼被擠壓，是逆斷層。"},
{m:"p",q:"動畫中，公路被橫向錯開，幾乎沒有上下位移。這是哪一種斷層？",o:["正斷層","逆斷層","平移斷層"],a:2,e:"岩層水平錯開，是平移斷層。"},

let Q=BANK.slice(0,10),qi=0,score=0,locked=false;
function startQuiz(){Q=BANK.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,10);qi=0;score=0;showQ()}
const qbox=document.getElementById("qbox");
function showQ(){
  if(qi>=Q.length){
    const msg=score>=Q.length*0.8?"你是板塊小博士！":score>=Q.length*0.5?"不錯喔，再練習一次會更強。":"先回實驗室多玩幾次再來挑戰。";
    qbox.innerHTML=`<div class="big">${score} / ${Q.length}</div><p style="text-align:center">${msg}</p><button class="btn sand" style="width:100%" id="again">再玩一次</button>`;
    document.getElementById("again").onclick=startQuiz;
    return;
  }
  const q=Q[qi];locked=false;
  qbox.innerHTML=`<div class="bar"><span>第 ${qi+1} / ${Q.length} 題</span><span>得分 ${score}</span></div>`+
  (q.m?`<svg id="qsvg" viewBox="0 0 400 220" role="img" aria-label="板塊動畫"></svg>`:"")+
  `<p>${q.q}</p><div class="opts" id="opts"></div><div id="fb"></div>`;
  if(q.m){const s=document.getElementById("qsvg");(function loop(){animate(s,q.m,()=>{if(document.getElementById("qsvg")===s)setTimeout(loop,600)})})()}
  const box=document.getElementById("opts");
  q.o.forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(i,b);box.appendChild(b)});
}
function pick(i,b){
  if(locked)return;locked=true;
  const q=Q[qi],all=document.querySelectorAll(".opt"),ok=i===q.a;
  all[q.a].classList.add("right");
  if(!ok)b.classList.add("wrong");else score++;
  document.getElementById("fb").innerHTML=`<div class="fb"><b>${ok?"答對了！":"再想想看。"}</b> ${q.e}</div><button class="btn sand" style="width:100%;margin-top:10px" id="next">${qi+1<Q.length?"下一題":"看成績"}</button>`;
  document.getElementById("next").onclick=()=>{qi++;showQ()};
}

const tabs={tLab:"lab",tMap:"map",tQuiz:"quiz"};
function showTab(id){
  Object.keys(tabs).forEach(k=>{
    document.getElementById(k).classList.toggle("on",k===id);
    document.getElementById(tabs[k]).classList.toggle("hide",k!==id);
  });
  if(id==="tQuiz")startQuiz();
}
Object.keys(tabs).forEach(k=>document.getElementById(k).onclick=()=>showTab(k));
